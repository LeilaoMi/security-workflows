name: Cloudflare ranges drift
# Phase 4 (2026-11-10): the CF IP-probe repos each hard-code Cloudflare's IP
# ranges (cf-best-ip, cf-termux-pick, doh-proxy, preferred-sub-generator).
# Weekly compare with the official list; open an issue here on drift.
on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: run
        run: |
          set +e
          python3 scripts/check_cf_ranges.py > report.md
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - if: steps.run.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          n=$(gh issue list -R "$REPO" --state open --search "Cloudflare IP ranges drifted in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$REPO" -F report.md
          else gh issue create -R "$REPO" -t "Cloudflare IP ranges drifted" -F report.md; fi
          exit 1
