name: Lint
# Shared lint (phase 2, 2026-11-10). Callers opt in per language:
#   with: { biome: true }   -> biome ci (config: repo biome.json)
#   with: { ruff: true }    -> ruff check (config: repo ruff.toml / pyproject)
on:
  workflow_call:
    inputs:
      biome:
        type: boolean
        default: false
      ruff:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  biome:
    if: inputs.biome
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.6.6
      - run: biome ci --reporter=github .
  ruff:
    if: inputs.ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.17.4
          args: check --output-format=github
