name: Dependabot auto-merge
# Phase 3 (2026-11-10). Turns on GitHub auto-merge for Dependabot PRs
# that are NOT semver-major. The merge itself only happens once every
# required status check in the repo's ruleset passes, so only call this
# from repos whose ruleset requires their real CI checks. Dependabot's
# 7-day cooldown is the other safety net.
on:
  workflow_call:
permissions: {}
jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
